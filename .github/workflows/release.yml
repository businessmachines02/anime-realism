# This update to the workflow does the following:
# - Adds a new step to generate SHA256 checksums for the ZIP artifact, placing them in a file called SHA256SUMS.
# - Attaches the SHA256SUMS file to the GitHub release alongside the ZIP file.
# - Includes a section in the release notes that displays the SHA256SUMS content, making it easy for users to verify downloads.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read tag version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: Release tag must look like vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "zip=anime_realism-${BASH_REMATCH[1]}.zip" >> "$GITHUB_OUTPUT"
          # Annotated tag message (`git tag -a -m`); empty for lightweight tags.
          NOTES="$(git tag -l --format='%(contents)' "$TAG" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
          {
            echo "notes<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate tag / manifest versions
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["RELEASE_TAG"]
          version = tag[1:]
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          if manifest.get("id") != "anime_realism":
              print(f"ERROR: manifest id is {manifest.get('id')!r}", file=sys.stderr)
              sys.exit(1)
          if str(manifest.get("version")) != version:
              print(f"ERROR: manifest version {manifest.get('version')!r} does not match {tag}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: anime_realism {version} matches {tag}")
          PY

      - name: Install LuaJIT for unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit zip unzip

      - name: Run unit tests
        run: |
          set -euo pipefail
          echo "==> luajit field/tests/run_grid_tests.lua"
          luajit field/tests/run_grid_tests.lua

      - name: Build release ZIP
        run: chmod +x ./build.sh && ./build.sh

      - name: Generate SHA256SUMS for ZIP
        id: shasum
        env:
          ZIP_NAME: ${{ steps.ver.outputs.zip }}
        run: |
          set -euo pipefail
          sha256sum "$ZIP_NAME" > SHA256SUMS
          cat SHA256SUMS
        # Output is "SHA256SUMS" file containing checksums, e.g.:
        # ef710...  anime_realism-1.2.3.zip

      - name: Validate ZIP structure
        env:
          ZIP_NAME: ${{ steps.ver.outputs.zip }}
        run: |
          set -euo pipefail
          test -f "$ZIP_NAME"
          python3 - <<'PY'
          import os, sys, zipfile
          zip_path = os.environ["ZIP_NAME"]
          with zipfile.ZipFile(zip_path) as zf:
              names = zf.namelist()
          required = [
              "manifest.json",
              "main.lua",
              "LICENSE",
              "lib/modload.lua",
              "hud/init.lua",
              "battle/init.lua",
              "field/init.lua",
          ]
          for req in required:
              if req not in names:
                  print(f"ERROR: ZIP missing {req} at archive root", file=sys.stderr)
                  sys.exit(1)
          if any(n.startswith("field/tests/") for n in names):
              print("ERROR: field tests included in ZIP", file=sys.stderr)
              sys.exit(1)
          faces = [n for n in names
                   if n.startswith("assets/portrait/") and n.endswith(".png")]
          if len(faces) < 1000:
              print(
                  f"ERROR: ZIP has {len(faces)} portrait PNGs "
                  "(Gen 1 roots must be tracked; see .gitignore)",
                  file=sys.stderr,
              )
              sys.exit(1)
          carets = [n for n in names if "^" in n]
          if carets:
              print(
                  f"ERROR: ZIP has {len(carets)} '^' names; "
                  "PhysicsFS cannot mount those",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("ZIP root check: ok")
          print(f"  files: {len(names)}")
          print(f"  portraits: {len(faces)}")
          PY

      - name: Prepare SHA256SUMS for release notes
        id: sha_note
        run: |
          echo "contents<<EOF" >> $GITHUB_OUTPUT
          cat SHA256SUMS >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Anime Realism ${{ steps.ver.outputs.version }}
          body: |
            ${{ steps.ver.outputs.notes }}

            ## SHA256SUMS

            ```txt
            ${{ steps.sha_note.outputs.contents }}
            ```
          generate_release_notes: ${{ steps.ver.outputs.notes == '' }}
          files: |
            ${{ steps.ver.outputs.zip }}
            SHA256SUMS
          fail_on_unmatched_files: true
